AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  SyteLine ERP integration: ONE Lambda function (the `action` of the request decides what runs) attached to an existing
  VPC, subnets and security groups, behind a private API. The stack creates no network resource.

Parameters:
  SytelineWsdl:
    Type: String
    Description: http://<host>/IDORequestService/IDOWebService.asmx?wsdl (HTTP, port 80 as documented)
  SytelineUser:
    Type: String
  SytelineSecretArn:
    Type: String
    Description: Secrets Manager secret (JSON) with SYTELINE_PASS
  SytelineConfig:
    Type: String
    Default: CCT
  DefaultWhse:
    Type: String
    Default: ""
  DefaultOrdType:
    Type: String
    Default: ""
  LiveWrites:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: Leave "false" except for an ERP-owner-approved test window (FR-016)
  # --- The existing network. The deployment creates NO network resource: it only attaches the function to these. ---
  WorkerVpcId:
    Type: String
    AllowedPattern: '^vpc-[0-9a-f]+$'
    Description: Existing VPC the function runs in. Required.
  WorkerSubnetIds:
    Type: String
    AllowedPattern: '^subnet-[0-9a-f]+(,subnet-[0-9a-f]+)*$'
    Description: >-
      Existing subnets of that VPC, comma-separated, with a route to the ERP and the database and a private path to
      Secrets Manager, DynamoDB and the IDP. One subnet is allowed but is not highly available. Required.
  WorkerSecurityGroupIds:
    Type: String
    AllowedPattern: '^sg-[0-9a-f]+(,sg-[0-9a-f]+)*$'
    Description: >-
      Existing security groups, comma-separated: outbound to the ERP (HTTP 80), the database (1433 when used) and HTTPS to the
      AWS services. This stack adds no rule to them. Required.
  ApiVpcEndpointId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^vpce-[0-9a-f]+$'
    Description: >-
      Existing execute-api interface VPC endpoint (vpce-...) through which approved clients call the private API.
      The stack never creates one. Optional: empty = no API at all (the function is then reached only by direct
      invocation, the IDP event and its own schedule).
  UseFipsEndpoints:
    Type: String
    Default: "true"
    AllowedValues: ["false", "true"]
    Description: Use FIPS AWS service endpoints (GovCloud)

  # --- Which route each ERP operation uses: an IDO name keeps it on the web service; `database` (or empty) uses the
  #     SyteLine database (the PO OCR demo's SQL calls). The database login lives in the ERP credentials secret. ---
  NextCoIdo:
    Type: String
    Default: database
    Description: >-
      IDO that exposes NextCoSp (the web service reserves the CO number) or `database` (the database's NextCoSp is run).
  NextJobIdo:
    Type: String
    Default: database
    Description: IDO that exposes NextWOSp (the web service reserves job numbers) or `database`.
  CustomerIdo:
    Type: String
    Default: database
    Description: Customer-address collection the web service searches, or `database` (the demo's customer search and scoring).
  DefaultsIdo:
    Type: String
    Default: database
    Description: Order collection the web service reads the customer's terms and ship-via from, or `database`.

  SqlEncrypt:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      "true" (default): the database connection is encrypted and the server certificate verified (SQL_CA_PEM in the ERP
      secret is required). "false": an UNENCRYPTED database connection is allowed and no CA is needed; the database
      login and password then cross the network unprotected, a warning is logged on every connection and the
      connectivity check reports it. A SQL Server set to Force Encryption refuses unencrypted clients.

  # --- Tuning (feature 004 / 005). Defaults equal the code's own defaults, so leaving these alone changes nothing. ---
  SiteId:
    Type: String
    Default: "10"
    AllowedPattern: '^[0-9]{1,6}$'
    Description: SyteLine site id passed to the numbering routines when the database route reserves numbers.
  MatchMinScore:
    Type: String
    Default: "70"
    AllowedPattern: '^[0-9]{1,3}(\.[0-9]+)?$'
    Description: Customer search (database route) - minimum score, 0 to 100, for a confident customer match.
  MatchMargin:
    Type: String
    Default: "3"
    AllowedPattern: '^[0-9]{1,3}(\.[0-9]+)?$'
    Description: Customer search - how far the best candidate must lead the runner-up, otherwise the match is ambiguous.
  MatchCap:
    Type: String
    Default: "1000"
    AllowedPattern: '^[0-9]{1,5}$'
    Description: Customer search - most candidate rows read from the customer address data.
  SqlVerifyHostname:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Encrypted database connections only: "false" turns off just the host-name check of the server certificate
      (the certificate chain is still verified); a warning is logged on every connection.
  SqlLoginTimeout:
    Type: String
    Default: "5"
    AllowedPattern: '^[0-9]{1,3}$'
    Description: Seconds allowed for the database connection and login.
  SqlTimeout:
    Type: String
    Default: "10"
    AllowedPattern: '^[0-9]{1,3}$'
    Description: Seconds allowed for a database statement.
  IdpDocumentClass:
    Type: String
    Default: ""
    Description: Expected IDP document class of a PO (empty = accept any). UNCONFIRMED until the IDP configuration is known.
  IdpFieldMap:
    Type: String
    Default: ""
    Description: >-
      JSON object overriding where the PO details sit in the IDP result, e.g. {"po_number":"purchase_order"}
      (keys as in src/syteline/idp_fields.py). Empty = the defaults. UNCONFIRMED names.

  # --- Job-number workflow (reserve / save): where the PO details are read from (an IDP accelerator stack) ---
  IdpStackName:
    Type: String
    Default: ""
    Description: >-
      Name of the IDP accelerator CloudFormation stack the PO details are read from (through the IDP SDK) by the
      job-number workflow. Empty = not configured: reserve and save then answer IDP_UNAVAILABLE. The functions need a
      private path to S3 and CloudFormation from the plant network (endpoints or NAT); this stack creates neither.
  IdpRegion:
    Type: String
    Default: ""
    Description: Region of the IDP stack (empty = this stack's region).
  IdpOutputBucketName:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: The IDP stack's output bucket (the functions may read it); required with IdpStackName.
  IdpTrackingTableName:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9_.-]{3,255}$'
    Description: The IDP stack's document tracking table (the functions may read it); required with IdpStackName.
  IdpStateMachineArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:aws[a-z-]*:states:[a-z0-9-]+:[0-9]+:stateMachine:[A-Za-z0-9_-]+$'
    Description: >-
      ARN of the IDP document-processing state machine (same account and region as this stack). When given, its
      SUCCEEDED execution events start the direct-invoke Lambda (action document_event), which reads the document and, if usable and live writes are
      on, reserves the job numbers and saves the order. Empty: nothing starts automatically.

# cfn-lint warns (W1030) that the empty defaults do not match the CIDR patterns; empty is intentional
# ("not supplied"), so that one check is ignored.
Metadata:
  cfn-lint:
    config:
      ignore_checks: [W1030]

# Rules are evaluated before any resource is created, so a bad combination is refused with a message.
Rules:
  IdpAllOrNothing:
    RuleCondition: !Or
      - !Not [!Equals [!Ref IdpStackName, ""]]
      - !Not [!Equals [!Ref IdpOutputBucketName, ""]]
      - !Not [!Equals [!Ref IdpTrackingTableName, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref IdpStackName, ""]]
          - !Not [!Equals [!Ref IdpOutputBucketName, ""]]
          - !Not [!Equals [!Ref IdpTrackingTableName, ""]]
        AssertDescription: Supply all three of IdpStackName, IdpOutputBucketName and IdpTrackingTableName, or none of them.

Conditions:
  # the job-number workflow can read its PO details (all three IDP identifiers supplied; the Rule refuses a partial set)
  HasIdp: !Not [!Equals [!Ref IdpStackName, ""]]
  IdpRegionGiven: !Not [!Equals [!Ref IdpRegion, ""]]
  HasIdpEvents: !Not [!Equals [!Ref IdpStateMachineArn, ""]]
  # the private API (and its permission) exists only when an existing execute-api endpoint is supplied
  HasApi: !Not [!Equals [!Ref ApiVpcEndpointId, ""]]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    CodeUri: .
    MemorySize: 256
    Layers:
      - !Ref DepsLayer
    Environment:
      Variables:
        JOBS_TABLE: !Ref JobsTable
        AWS_USE_FIPS_ENDPOINT: !Ref UseFipsEndpoints

Resources:
  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      BuildMethod: makefile
    Properties:
      LayerName: sytline-connect-deps
      ContentUri: .
      CompatibleRuntimes: [python3.13]
      CompatibleArchitectures: [x86_64]

  # Upload jobs, job-number reservations, document-event claims and the ERP-write lock. Retained: the stack can never delete
  # or replace it (specs/007 FR-009).
  JobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # The private API in front of the function; created only when ApiVpcEndpointId is given. Its routes are defined here (not as
  # Events of the function) because an Event cannot be conditional. Every route is proxied to the one function.
  OrderApi:
    Type: AWS::Serverless::Api
    Condition: HasApi
    Properties:
      StageName: prod
      EndpointConfiguration:
        Type: PRIVATE
        VPCEndpointIds:
          - !Ref ApiVpcEndpointId
      Auth:
        DefaultAuthorizer: AWS_IAM
        ResourcePolicy:
          IntrinsicVpcWhitelist:
            - !Ref ApiVpcEndpointId
      DefinitionBody:
        swagger: "2.0"
        info:
          title: !Ref AWS::StackName
          version: "1.0"
        paths:
          /confirmed-orders:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DirectFunction.Arn}/invocations
                credentials: !Sub arn:${AWS::Partition}:iam::*:user/*   # the caller's own credentials invoke the function, as before
          /upload-jobs/{id}:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DirectFunction.Arn}/invocations
                credentials: !Sub arn:${AWS::Partition}:iam::*:user/*   # the caller's own credentials invoke the function, as before
          /job-reservations:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DirectFunction.Arn}/invocations
                credentials: !Sub arn:${AWS::Partition}:iam::*:user/*   # the caller's own credentials invoke the function, as before
          /job-reservations/{id}/save:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DirectFunction.Arn}/invocations
                credentials: !Sub arn:${AWS::Partition}:iam::*:user/*   # the caller's own credentials invoke the function, as before
          /job-reservations/{id}:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DirectFunction.Arn}/invocations
                credentials: !Sub arn:${AWS::Partition}:iam::*:user/*   # the caller's own credentials invoke the function, as before

  OrderApiPermission:
    Type: AWS::Lambda::Permission
    Condition: HasApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DirectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${OrderApi}/*/*/*

  # THE function. The request decides what runs: an API route, an `action` (health, notes, document_event, the background
  # work_upload / work_save / sweep), or by default the IDP finished-document event. It is attached to the existing network and
  # starts its own background work, so its name is fixed (the role can name it without a circular reference).
  DirectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${AWS::StackName}-fn"
      Handler: lambda_function.lambda_handler
      Timeout: 300
      EventInvokeConfig:
        MaximumRetryAttempts: 0          # never replay a reservation or a save automatically (asynchronous invokes only)
      VpcConfig:
        SecurityGroupIds: !Split [",", !Ref WorkerSecurityGroupIds]
        SubnetIds: !Split [",", !Ref WorkerSubnetIds]
      Environment:
        Variables:
          SYTELINE_WSDL: !Ref SytelineWsdl
          SYTELINE_USER: !Ref SytelineUser
          SYTELINE_CONFIG: !Ref SytelineConfig
          SYTELINE_SECRET_ARN: !Ref SytelineSecretArn
          SYTELINE_LIVE_WRITES: !Ref LiveWrites
          SYTELINE_NEXT_CO_IDO: !Ref NextCoIdo
          SYTELINE_NEXT_JOB_IDO: !Ref NextJobIdo
          SYTELINE_CUSTOMER_IDO: !Ref CustomerIdo
          SYTELINE_DEFAULTS_IDO: !Ref DefaultsIdo
          SYTELINE_SQL_ENCRYPT: !Ref SqlEncrypt
          SYTELINE_SITE_ID: !Ref SiteId
          SYTELINE_MATCH_MIN_SCORE: !Ref MatchMinScore
          SYTELINE_MATCH_MARGIN: !Ref MatchMargin
          SYTELINE_MATCH_CAP: !Ref MatchCap
          SYTELINE_SQL_VERIFY_HOSTNAME: !Ref SqlVerifyHostname
          SYTELINE_SQL_LOGIN_TIMEOUT: !Ref SqlLoginTimeout
          SYTELINE_SQL_TIMEOUT: !Ref SqlTimeout
          SYTELINE_DEFAULT_WHSE: !Ref DefaultWhse
          SYTELINE_DEFAULT_ORDTYPE: !Ref DefaultOrdType
          IDP_STACK_NAME: !Ref IdpStackName
          IDP_REGION: !Ref IdpRegion
          IDP_DOCUMENT_CLASS: !Ref IdpDocumentClass
          IDP_FIELD_MAP: !Ref IdpFieldMap
          WORKER_TIMEOUT_SECONDS: "300"
          SWEEPER_REDRIVE_AFTER_SECONDS: "120"
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref SytelineSecretArn
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-fn
        - !If
          - HasIdp
          - Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                Resource: !Sub
                  - arn:${AWS::Partition}:cloudformation:${IdpRegionName}:${AWS::AccountId}:stack/${IdpStackName}*/*
                  - IdpRegionName: !If [IdpRegionGiven, !Ref IdpRegion, !Ref "AWS::Region"]
              # the IDP SDK resolves the stack's resources by invoking the IDP stack's own LookupFunction
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub
                  - arn:${AWS::Partition}:lambda:${IdpRegionName}:${AWS::AccountId}:function:${IdpStackName}-LookupFunction-*
                  - IdpRegionName: !If [IdpRegionGiven, !Ref IdpRegion, !Ref "AWS::Region"]
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${IdpOutputBucketName}/*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                Resource: !Sub
                  - arn:${AWS::Partition}:dynamodb:${IdpRegionName}:${AWS::AccountId}:table/${IdpTrackingTableName}
                  - IdpRegionName: !If [IdpRegionGiven, !Ref IdpRegion, !Ref "AWS::Region"]
          - !Ref AWS::NoValue
      Events:
        Sweep:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"action":"sweep"}'

  # Starts DirectFunction (action `document_event`, the default) from the IDP state machine's SUCCEEDED events; exists only
  # when IdpStateMachineArn is given
  IdpDocumentEventRule:
    Type: AWS::Events::Rule
    Condition: HasIdpEvents
    Properties:
      Description: IDP document processing finished -> read the document and, if usable, reserve and save
      EventPattern:
        source: [aws.states]
        detail-type: [Step Functions Execution Status Change]
        detail:
          status: [SUCCEEDED]
          stateMachineArn: [!Ref IdpStateMachineArn]
      Targets:
        - Id: event-intake
          Arn: !GetAtt DirectFunction.Arn

  IdpDocumentEventPermission:
    Type: AWS::Lambda::Permission
    Condition: HasIdpEvents
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DirectFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IdpDocumentEventRule.Arn

Outputs:
  DirectFunctionName:
    Description: >-
      The one Lambda function. Send it an action, an IDP finished-document event, or an API request.
    Value: !Ref DirectFunction
  FunctionArn:
    Value: !GetAtt DirectFunction.Arn
  ApiId:
    Condition: HasApi
    Value: !Ref OrderApi
  JobsTableName:
    Value: !Ref JobsTable
  AttachedVpcId:
    Value: !Ref WorkerVpcId
